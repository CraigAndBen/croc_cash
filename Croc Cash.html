<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croc Cash</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e4ecd8; --panel:#f6f9ee; --ink:#16301f; --muted:#55705c; --accent:#c98a0b;
  --water:#2f6f6a; --water2:#2a655f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1f1b; --panel:#17302a; --ink:#e8f2dc; --muted:#8fb09a; --accent:#f0b429;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1f1b; --panel:#17302a; --ink:#e8f2dc; --muted:#8fb09a; --accent:#f0b429;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;touch-action:none}
h1{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:clamp(28px,6vw,44px);margin:0;letter-spacing:.02em}
.bar{display:flex;gap:12px;width:min(92vw,520px);justify-content:space-between}
.stat{background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:800;flex:1;text-align:center}
.stat small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.stat b{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:22px;color:var(--accent)}
.wrap{position:relative;width:min(92vw,520px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;border-radius:14px;border:4px solid var(--ink)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(10,30,26,.82);border-radius:14px;color:#f1f7e6;text-align:center;padding:20px}
.overlay h2{font-family:'Bungee',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(24px,6vw,36px)}
.overlay p{margin:0;max-width:30ch;color:#bcd3c0}
button{font-family:'Bungee',Impact,sans-serif;font-size:18px;padding:10px 22px;border:0;border-radius:999px;background:#f0b429;color:#2a1c00;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{color:var(--muted);font-size:14px;margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;width:min(92vw,520px)}
button.sm{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:14px;padding:6px 14px;background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
.trk{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden{display:none}
</style>
</head>
<body>
<h1>Croc Cash</h1>
<div class="bar">
  <div class="stat"><small>Cash eaten</small><b id="score">$0</b></div>
  <div class="stat"><small>Best</small><b id="best">$0</b></div>
</div>
<div class="wrap">
  <canvas id="c" width="520" height="520" aria-label="Crocodile game board"></canvas>
  <div class="overlay" id="ov">
    <h2 id="ovT">Feed the croc</h2>
    <p id="ovP">Eat the money. Don’t bite the walls or your own tail.</p>
    <button id="go">Start</button>
  </div>
</div>
<div class="ctl">
  <button class="sm" id="mute">Sound: on</button>
</div>
<p class="hint">Arrow keys or WASD to steer · Space to pause · swipe on phones</p>

  var MUSIC_FADE=1.5;   // seconds of crossfade at the loop point (raise it for a softer blend, 0 = hard loop)
  var MUSIC_VOLUME=.5;  // 0 to 1

  /* ---------- Audio ---------- */
  var Snd=(function(){
    var ac=null, master, sfxG, musG, muted=false, mTimer=null, beatN=0, custom=null, fx={};
    var bass=[110,0,110,131,0,110,147,98], lead=[0,440,0,0,523,0,392,0];
    ['eat','gold','over'].forEach(function(k){
      if(!SOUND_FILES[k]) return;
      fx[k]=new Audio(SOUND_FILES[k]); fx[k].preload='auto';
      fx[k].onerror=function(){ delete fx[k]; };
    });
    if(SOUND_FILES.music) custom=makeLoop(SOUND_FILES.music,function(){ custom=null; });
    /* Seamless music loop: two copies of the track overlap, so the end fades out
       while the start fades in. Avoids the silent gap of the browser's loop=true. */
    function makeLoop(src,onFail){
      var a=[new Audio(src),new Audio(src)], cur=0, iv=null;
      a.forEach(function(el){ el.preload='auto'; el.volume=0; el.onerror=onFail; });
      function frame(){
        a.forEach(function(el,i){
          if(el.paused) return;
          var d=el.duration; if(!d||!isFinite(d)) return;
          var t=el.currentTime, f=Math.max(.05,Math.min(MUSIC_FADE,d/2)), left=d-t;
          var g=(MUSIC_FADE>0)?Math.min(1,t/f)*Math.min(1,left/f):1;
          el.volume=Math.max(0,Math.min(1,MUSIC_VOLUME*g));
          if(i===cur && left<=f+.02 && a[1-i].paused){
            var o=a[1-i]; o.currentTime=0; var q=o.play(); if(q&&q.catch) q.catch(function(){});
            cur=1-i;
          }
          if(MUSIC_FADE<=0 && el.ended){ el.currentTime=0; el.play(); }
        });
      }
      function play(el){ var p=el.play(); if(p&&p.catch) p.catch(function(){}); }
      return {
        start:function(restart){
          if(restart){ a.forEach(function(el){ el.pause(); el.currentTime=0; el._on=false; }); cur=0; a[0]._on=true; a[0].volume=MUSIC_FADE>0?0:MUSIC_VOLUME; }
          else if(!a[0]._on&&!a[1]._on) a[cur]._on=true;
          a.forEach(function(el){ if(el._on) play(el); });
          clearInterval(iv); iv=setInterval(frame,40);
        },
        stop:function(){ clearInterval(iv); a.forEach(function(el){ el._on=!el.paused; el.pause(); }); },
        mute:function(m){ a.forEach(function(el){ el.muted=m; }); }
      };
    }
    function playFx(k){
      var a=fx[k]; if(!a) return false;
      a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){});
      return true;
    }
    function init(){
      if(ac) return;
      var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      ac=new C(); master=ac.createGain(); master.gain.value=muted?0:1; master.connect(ac.destination);
      sfxG=ac.createGain(); sfxG.gain.value=.5; sfxG.connect(master);
      musG=ac.createGain(); musG.gain.value=.22; musG.connect(master);
    }
    function tone(f,t0,d,type,g,dest,slide){
      var o=ac.createOscillator(), e=ac.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t0);
      if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
      e.gain.setValueAtTime(.0001,t0); e.gain.exponentialRampToValueAtTime(g,t0+.01); e.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.connect(e); e.connect(dest); o.start(t0); o.stop(t0+d+.02);
    }

      var t=ac.currentTime+.02, i=beatN++%8;
      if(bass[i]) tone(bass[i],t,.28,'triangle',.5,musG);
      if(lead[i]) tone(lead[i],t,.18,'square',.12,musG);
    }
    return {
      resume:function(){ init(); if(ac&&ac.state==='suspended') ac.resume(); },
      eat:function(gold){
        if(playFx(gold&&fx.gold?'gold':'eat')) return;
        if(!ac) return; var t=ac.currentTime;
        if(gold){ [660,830,990,1320].forEach(function(f,i){ tone(f,t+i*.07,.14,'triangle',.6,sfxG); }); }
        else { tone(260,t,.12,'square',.5,sfxG,120); tone(660,t+.05,.1,'sine',.5,sfxG); tone(990,t+.11,.14,'sine',.5,sfxG); }
      },
      over:function(){
        if(playFx('over')) return;
        if(!ac) return; var t=ac.currentTime;

        if(!ac||mTimer) return; beatN=0; mTimer=setInterval(beat,230);
      },
      musicOff:function(){
        if(custom) custom.stop();

      },

      }

  var muteB=document.getElementById('mute');
  muteB.onclick=function(){ Snd.resume(); muteB.textContent='Sound: '+(Snd.toggleMute()?'off':'on'); muteB.blur(); };

  try{ best=parseInt(localStorage.getItem('croc-best'),10)||0; }catch(e){}
  bestEl.textContent='$'+best;

  function reset(){
    croc=[{x:6,y:10},{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    dir={x:1,y:0}; queue=[]; score=0; tick=150;
    scoreEl.textContent='$0';
    placeMoney();
  }
  function placeMoney(){
    var ok=false;
    while(!ok){
      money={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),gold:Math.random()<.15};
      ok=!croc.some(function(s){return s.x===money.x&&s.y===money.y});
    }
  }
  function start(){
    reset(); state='play'; ov.classList.add('hidden');
    Snd.resume(); Snd.musicOff(); Snd.musicOn(true);
    clearInterval(timer); timer=setInterval(step,tick);
  }
  function setSpeed(){ clearInterval(timer); timer=setInterval(step,tick); }

  function step(){
    if(queue.length) dir=queue.shift();
    var h={x:croc[0].x+dir.x,y:croc[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||croc.some(function(s){return s.x===h.x&&s.y===h.y})) return over();
    croc.unshift(h);
    if(h.x===money.x&&h.y===money.y){
      score+=money.gold?50:10; Snd.eat(money.gold);
      scoreEl.textContent='$'+score;
      if(!money.gold && tick>70){ tick-=3; setSpeed(); }
      placeMoney();
    } else croc.pop();
    draw();
  }
  function over(){
    clearInterval(timer); state='over'; Snd.musicOff(); Snd.over();
    if(score>best){ best=score; bestEl.textContent='$'+best; try{localStorage.setItem('croc-best',best)}catch(e){} }
    draw();
    ovT.textContent='Chomp! Game over';
    ovP.textContent='The croc ate $'+score+'. '+(score>=best&&score>0?'New best!':'Try for a fatter belly.');
    goBtn.textContent='Play again'; ov.classList.remove('hidden');
  }
  function pause(){
    if(state==='play'){ state='pause'; clearInterval(timer); Snd.musicOff(); ovT.textContent='Paused'; ovP.textContent='The croc is sunbathing.'; goBtn.textContent='Resume'; ov.classList.remove('hidden'); }
    else if(state==='pause'){ state='play'; ov.classList.add('hidden'); setSpeed(); Snd.resume(); Snd.musicOn(); }
  }
  goBtn.onclick=function(){ state==='pause'?pause():start(); };

  function turn(dx,dy){
    if(state!=='play') return;
    var last=queue.length?queue[queue.length-1]:dir;
    if(last.x===-dx&&last.y===-dy||last.x===dx&&last.y===dy) return;
    if(queue.length<2) queue.push({x:dx,y:dy});
  }
  var keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
  addEventListener('keydown',function(e){
    var k=e.key.length===1?e.key.toLowerCase():e.key;
    if(keys[k]){ e.preventDefault(); turn(keys[k][0],keys[k][1]); }
    else if(e.key===' '){ e.preventDefault(); if(state==='play'||state==='pause') pause(); else if(document.activeElement!==goBtn) start(); }
  });
  var tx,ty;
  cv.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
  },{passive:true});

  function draw(){
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      ctx.fillStyle=(x+y)%2?'#2f6f6a':'#2a655f'; ctx.fillRect(x*S,y*S,S,S);
    }
    drawMoney();
    drawCroc();
  }
  function drawMoney(){
    var px=money.x*S, py=money.y*S;
    if(money.gold){
      ctx.fillStyle='#f0b429'; ctx.beginPath(); ctx.arc(px+S/2,py+S/2,S*.4,0,7); ctx.fill();
      ctx.strokeStyle='#a56d00'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#7a4f00'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',px+S/2,py+S/2+1);
    } else {
      ctx.fillStyle='#7bc47f'; ctx.fillRect(px+2,py+6,S-4,S-12);
      ctx.strokeStyle='#2d7a3a'; ctx.lineWidth=1.5; ctx.strokeRect(px+2.5,py+6.5,S-5,S-13);
      ctx.fillStyle='#2d7a3a'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',px+S/2,py+S/2+.5);
    }
  }
  function drawCroc(){
    var n=croc.length;
    for(var i=n-1;i>=0;i--){
      var s=croc[i], t=1-(i/n)*.45, size=(S-2)*t, o=(S-size)/2;
      ctx.fillStyle=i%2?'#3f8f3c':'#4aa046';
      rr(s.x*S+o,s.y*S+o,size,size,5); ctx.fill();
      if(i>0&&i<n-1&&i%2===0){ ctx.fillStyle='#2c6b2b'; ctx.fillRect(s.x*S+S/2-2,s.y*S+S/2-2,4,4); }
    }
    var h=croc[0], cx=h.x*S+S/2, cy=h.y*S+S/2, d=dir;
    ctx.fillStyle='#55b350'; rr(h.x*S+1,h.y*S+1,S-2,S-2,7); ctx.fill();
    var px=-d.y, py=d.x; // perpendicular
    // snout nostrils
    ctx.fillStyle='#1d4a1c';
    [-1,1].forEach(function(k){ ctx.beginPath(); ctx.arc(cx+d.x*9+px*k*4,cy+d.y*9+py*k*4,1.8,0,7); ctx.fill(); });
    // eyes
    [-1,1].forEach(function(k){
      var ex=cx+d.x*2+px*k*8, ey=cy+d.y*2+py*k*8;
      ctx.fillStyle='#ffe66b'; ctx.beginPath(); ctx.arc(ex,ey,4,0,7); ctx.fill();
      ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(ex+d.x*1.5,ey+d.y*1.5,1.8,0,7); ctx.fill();
    });
    // teeth
    ctx.fillStyle='#fff';
    [-1,1].forEach(function(k){ ctx.beginPath(); ctx.arc(cx+d.x*12+px*k*6,cy+d.y*12+py*k*6,1.4,0,7); ctx.fill(); });
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  reset(); draw();
})();
</script>
</body>
